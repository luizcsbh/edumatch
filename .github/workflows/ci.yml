name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-pipeline:
    name: Dataset Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dataset-pipeline/package.json

      - name: Install Dependencies
        working-directory: ./dataset-pipeline
        run: npm install

      - name: Run Tests
        working-directory: ./dataset-pipeline
        run: npm test

  lint-and-test-ml-service:
    name: ML Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: matching-ml-service/package.json

      - name: Install System Dependencies for TensorFlow
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install Dependencies
        working-directory: ./matching-ml-service
        run: npm install

      - name: Run Tests
        working-directory: ./matching-ml-service
        run: npm test

  test-backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, zip
          coverage: none

      - name: Validate PHP Syntax
        run: find backend/app -name "*.php" -exec php -l {} \;

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-and-test-pipeline, lint-and-test-ml-service, test-backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Dataset Pipeline Image
        uses: docker/build-push-action@v5
        with:
          context: ./dataset-pipeline
          push: false
          tags: edumatch-dataset-pipeline:latest

      - name: Build ML Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./matching-ml-service
          push: false
          tags: edumatch-ml-service:latest

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: edumatch-backend:latest
